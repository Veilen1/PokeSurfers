name: pokesurfers

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trailkin}
      POSTGRES_USER: ${POSTGRES_USER:-trailkin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trailkin}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - trailkin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trailkin} -d ${POSTGRES_DB:-trailkin}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trailkin-postgres:
