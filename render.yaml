services:
  - type: web
    name: pokesurfers-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build --workspace=@trailkin/api
    startCommand: node backend/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://pokesurfers.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
